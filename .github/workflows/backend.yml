name: Build and publish backend image

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

env:
  DOCKERHUB_USERNAME: tazmans
  IMAGE_NAME: smartcar-backend

jobs:
  version:
    runs-on: ubuntu-latest

    outputs:
      backend_version: ${{ steps.update_backend.outputs.backend_version }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: true

      - name: Update backend version
        id: update_backend
        run: |
          VERSION=$(cat VERSION)

          IFS='.' read -r MAJOR MINOR PATCH <<< "$VERSION"

          PATCH=$((PATCH + 1))

          NEW_VERSION="$MAJOR.$MINOR.$PATCH"

          echo "$NEW_VERSION" > VERSION

          echo "backend_version=$NEW_VERSION" >> "$GITHUB_OUTPUT"

          echo "Backend version: $VERSION -> $NEW_VERSION"

      - name: Upload version file
        uses: actions/upload-artifact@v4
        with:
          name: backend-version-files
          path: VERSION

  build:
    needs: version
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_TOKEN }}

      - name: Build and push backend
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          provenance: false
          sbom: false
          tags: ${{ env.DOCKERHUB_USERNAME }}/${{ env.IMAGE_NAME }}:${{ needs.version.outputs.backend_version }}
          cache-from: type=gha,scope=backend
          cache-to: type=gha,mode=max,scope=backend

  release:
    needs:
      - version
      - build

    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: true

      - name: Download version file
        uses: actions/download-artifact@v4
        with:
          name: backend-version-files
          path: .

      - name: Commit version change
        run: |
          git config user.name "Smartcar CI"
          git config user.email "ci@smartcar.local"

          git add VERSION

          if git diff --cached --quiet; then
            echo "No version changes"
          else
            git commit -m "ci: bump backend version [skip ci]"
            git push
          fi