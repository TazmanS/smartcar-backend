name: Build and publish backend images

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

env:
  DOCKERHUB_USERNAME: tazmans
  BACKEND_IMAGE_NAME: smartcar-backend
  MIGRATIONS_IMAGE_NAME: smartcar-migrations

jobs:
  version:
    runs-on: ubuntu-latest

    outputs:
      backend_version: ${{ steps.update_backend.outputs.backend_version }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: true

      - name: Update backend version
        id: update_backend
        run: |
          VERSION=$(cat VERSION)

          IFS='.' read -r MAJOR MINOR PATCH <<< "$VERSION"

          PATCH=$((PATCH + 1))

          NEW_VERSION="$MAJOR.$MINOR.$PATCH"

          echo "$NEW_VERSION" > VERSION

          echo "backend_version=$NEW_VERSION" >> "$GITHUB_OUTPUT"

          echo "Backend version: $VERSION -> $NEW_VERSION"

      - name: Upload version file
        uses: actions/upload-artifact@v4
        with:
          name: backend-version-files
          path: VERSION

  build:
    needs: version
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_TOKEN }}

      - name: Build and push backend
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          provenance: false
          sbom: false
          tags: ${{ env.DOCKERHUB_USERNAME }}/${{ env.BACKEND_IMAGE_NAME }}:${{ needs.version.outputs.backend_version }}
          cache-from: type=gha,scope=backend
          cache-to: type=gha,mode=max,scope=backend

      - name: Build and push migrations
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.migrations
          platforms: linux/amd64,linux/arm64
          push: true
          provenance: false
          sbom: false
          tags: ${{ env.DOCKERHUB_USERNAME }}/${{ env.MIGRATIONS_IMAGE_NAME }}:${{ needs.version.outputs.backend_version }}
          cache-from: type=gha,scope=migrations
          cache-to: type=gha,mode=max,scope=migrations

  release:
    needs:
      - version
      - build

    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: true

      - name: Download version file
        uses: actions/download-artifact@v4
        with:
          name: backend-version-files
          path: .

      - name: Commit version change
        run: |
          git config user.name "SmartCar CI"
          git config user.email "ci@smartcar.local"

          git add VERSION

          if git diff --cached --quiet; then
            echo "No version changes"
          else
            git commit -m "ci: bump backend version [skip ci]"
            git push
          fi

  deploy:
    needs:
      - version
      - release

    runs-on: ubuntu-latest

    steps:
      - name: Checkout deployment repository
        uses: actions/checkout@v4
        with:
          repository: TazmanS/smartcar-devops
          token: ${{ secrets.DEPLOYMENT_REPO_TOKEN }}
          path: deployment
          fetch-depth: 0

      - name: Install yq
        run: |
          sudo wget -O /usr/local/bin/yq \
            https://github.com/mikefarah/yq/releases/latest/download/yq_linux_amd64
          sudo chmod +x /usr/local/bin/yq

      - name: Show yq version
        run: yq --version

      - name: Update backend image version
        working-directory: deployment
        run: |
          yq -i '
            .spec.template.spec.containers[0].image =
            "tazmans/smartcar-backend:${{ needs.version.outputs.backend_version }}"
          ' kubernetes/base/backend/deployment.yaml

      - name: Update migrations image version
        working-directory: deployment
        run: |
          yq -i '
            .spec.template.spec.containers[0].image =
            "tazmans/smartcar-migrations:${{ needs.version.outputs.backend_version }}"
          ' kubernetes/base/migrations/job.yaml

      - name: Commit deployment changes
        working-directory: deployment
        run: |
          git config user.name "SmartCar CI"
          git config user.email "ci@smartcar.local"

          git add \
            kubernetes/base/backend/deployment.yaml \
            kubernetes/base/migrations/job.yaml

          if git diff --cached --quiet; then
            echo "No deployment changes"
          else
            git commit -m "ci: update backend image versions"
            git push
          fi