basePath: /
definitions:
  dto.CarAction:
    enum:
    - forward
    - backward
    - left
    - right
    - stop
    type: string
    x-enum-varnames:
    - CarActionForward
    - CarActionBackward
    - CarActionLeft
    - CarActionRight
    - CarActionStop
  dto.CarActionRequest:
    properties:
      action:
        $ref: '#/definitions/dto.CarAction'
    type: object
  dto.CarStatusResponse:
    properties:
      message:
        type: string
      status:
        type: string
    type: object
  dto.GetCarsListRequest:
    properties:
      order:
        description: asc | desc
        type: string
      page:
        type: integer
      per_page:
        type: integer
      search:
        type: string
      sort_by:
        type: string
    type: object
  dto.GetCarsListResponse:
    properties:
      data:
        items:
          $ref: '#/definitions/models.Car'
        type: array
      page:
        $ref: '#/definitions/dto.PageInfo'
    type: object
  dto.PageInfo:
    properties:
      page:
        type: integer
      per_page:
        type: integer
      total_items:
        type: integer
      total_pages:
        type: integer
    type: object
  models.Car:
    properties:
      createdAt:
        type: string
      id:
        type: string
      lastSeen:
        type: string
      name:
        type: string
      updatedAt:
        type: string
    type: object
host: localhost:8080
info:
  contact: {}
  description: SmartCar Backend API
  title: SmartCar API
  version: "1.0"
paths:
  /api/car-actions:
    post:
      consumes:
      - application/json
      description: Send action to the car via MQTT
      parameters:
      - description: Car action
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/dto.CarActionRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
        "400":
          description: Bad Request
          schema:
            type: string
        "500":
          description: Internal Server Error
          schema:
            type: string
      summary: Send car action
      tags:
      - Car
  /api/car-status:
    get:
      description: Returns current car status
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/dto.CarStatusResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/dto.CarStatusResponse'
      summary: Get car status
      tags:
      - Car
  /api/car-stream:
    get:
      description: Returns current car stream
      produces:
      - application/json
      responses:
        "200":
          description: OK
        "500":
          description: Internal Server Error
      summary: Get car camera stream
      tags:
      - Car
  /api/cars/list:
    post:
      consumes:
      - application/json
      description: Returns a paginated list of registered cars
      parameters:
      - description: Pagination parameters
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/dto.GetCarsListRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/dto.GetCarsListResponse'
        "400":
          description: Bad Request
          schema:
            type: string
        "500":
          description: Internal Server Error
          schema:
            type: string
      summary: Get paginated list of cars
      tags:
      - Car
swagger: "2.0"
